[project]
name = "tripmate"
version = "0.1.0"
description = "TripMate — консольный ассистент путешественника на локальных LLM (llama.cpp) и OpenRouter"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.7",
    "langchain-classic>=1.0.8",
    "langchain-openai>=1.7.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "openai>=1.40",
]

[tool.uv]
package = false
